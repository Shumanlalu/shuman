plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shuman.clock'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.shuman.clock'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '1.4.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    androidResources {
        noCompress += ['wav']
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}

def webRoot = rootProject.projectDir.parentFile
def webAssets = layout.projectDirectory.dir('src/main/assets/www')

tasks.register('syncWebAssets', Copy) {
    description = 'Copies the shuman web app into the Android assets folder.'
    from(webRoot) {
        include 'index.html'
        include 'styles.css'
        include 'app.js'
        include 'fonts/**'
        include 'alarm-sounds/**'
    }
    into(webAssets)
}

tasks.named('preBuild') {
    dependsOn 'syncWebAssets'
}
